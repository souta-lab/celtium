name: Celtium

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Six test modules under scripts/tests (and scripts/cpu-contract/menu-region-floor-check.py, which a
      # seventh loads) read committed frames with Pillow (`from PIL import Image`). The runner's system
      # Python has no Pillow, so those tests errored at import and the suite reported FAILED (errors=8)
      # without ever running them. The library is a test dependency, not an optional tool, so it is
      # installed here, the way the minecraft-1122 job installs glslang-tools.
      - name: Install the image library the checks import
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil
      - name: Test development-process safety (no GPU or game)
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 scripts/cpu-contract/shared_game_slot_check.py
          python3 scripts/cpu-contract/glless_hint_descriptor_check.py
          python3 scripts/check_agent_docs.py
          bash -n scripts/gv-leg.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test GPU-independent Vulkan and GL compatibility contracts
        run: |
          python3 scripts/cpu-contract/loading_capture_boundary_check.py
          python3 scripts/cpu-contract/loading_resize_state_check.py
          python3 scripts/cpu-contract/game_loop_timing_check.py
          python3 scripts/cpu-contract/dynamic_texture_dimensions_check.py
          python3 scripts/cpu-contract/offtarget_rendered_name_check.py
          python3 scripts/cpu-contract/shader_push_constant_check.py
          python3 scripts/cpu-contract/present_drain_check.py
          python3 scripts/cpu-contract/font-state-boundary-check.py
          python3 scripts/cpu-contract/parallel_atlas_await_check.py
          python3 scripts/cpu-contract/parallel_atlas_sync_refusal_check.py
          python3 scripts/modpack-compat/test_lock_archive.py
          python3 scripts/modpack-compat/test_e2e_celtium_mods.py
          python3 scripts/modpack-compat/test_e2e_stellar_parallel_config.py
          python3 scripts/modpack-compat/test_cf_file_index.py
          python3 scripts/modpack-compat/test_pack_stage_resolve.py
          python3 scripts/cpu-contract/pack_stage_check.py
          python3 scripts/cpu-contract/fixture_tick_liveness_check.py
          python3 scripts/cpu-contract/repeatable_screen_dismissal_check.py
          python3 scripts/cpu-contract/live_terrain_backend_report_check.py
          python3 scripts/cpu-contract/glless_mapped_staging_guard_check.py
          python3 scripts/cpu-contract/isolated_game_directory_check.py
          python3 scripts/cpu-contract/glless_early_install_check.py
          python3 scripts/cpu-contract/glless_transformer_injection_check.py
          python3 scripts/cpu-contract/glless_lwjgl3_surface_check.py

  minecraft-1122:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21
            25
      - uses: gradle/actions/setup-gradle@v4.4.4
      # :celtium-vulkan:compileTerrainShaders compiles the shaders into the packaged resources, and its compiler path
      # defaults to the workspace-relative, gitignored `.celtium-work/gpu-tools/extracted/usr/bin/glslangValidator`
      # (`celtium-vulkan/build.gradle:124-133`, wired into `processResources`). A checkout has neither that directory
      # nor the tool, so every PR failed with `Cannot run program ".../.celtium-work/...": Exec failed, error: 2`.
      # The compiler is a build dependency, not an optional tool - the SPIR-V it emits is what the loader reads - so it
      # is installed here and handed to the task through the property the task already reads
      # (`providers.gradleProperty('glslang_validator')`). Compiling and validating the shaders stays in the build;
      # nothing is skipped and no check is removed.
      - name: Install the shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslang-tools
          glslangValidator --version | head -1
      - name: Build Minecraft 1.12.2 mod
        run: >-
          ./gradlew -p build-1122 :forge122:packageJar --console=plain --stacktrace
          "-Pglslang_validator=$(command -v glslangValidator)"
      # The renderer's own JUnit suite (issue #382): the Vulkan-free contracts - submission scheduling, swapchain
      # cleanup decisions, texture environment, map ranges, the HugeMethodLimit guard - run here with the same shader
      # compiler the build used.
      - name: Test celtium-vulkan
        run: >-
          ./gradlew -p build-1122 :celtium-vulkan:test --console=plain --stacktrace
          "-Pglslang_validator=$(command -v glslangValidator)"
      # These contracts require full Git history and compiled celtium-vulkan classes.
      # Keep them after the real Forge build, not in the isolated probe job.
      - name: Test compiled swapchain arguments and initializer preservation
        run: |
          python3 scripts/cpu-contract/field_initializer_check.py
          python3 scripts/cpu-contract/swapchain_create_args_check.py
          python3 scripts/cpu-contract/frustum_camera_offset_check.py
      - name: Verify packaged mod contents
        run: python3 scripts/verify_forge_jar.py build-1122/build/libs/*/*.jar
      # The artifact's name, its mcmod.info version, the build's default and the plan's header table are four places the
      # same version is written; nothing compared them, and a leg was once run against a jar left over from the previous
      # naming family because a recipe still pointed at the old path (docs/plan.md row 47). This reads all four and
      # names the field that disagrees.
      - name: Verify artifact versions
        run: python3 scripts/verify_version_consistency.py
      - uses: actions/upload-artifact@v4
        with:
          name: celtium-forge-1122
          path: build-1122/build/libs/**/*.jar

  # The renderer's own suite on the other desktop OSes. Until v0.2.2-rc1 every job ran on Ubuntu, and a Linux-only
  # assumption in the GL stub (its readable-range guard read /proc/self/maps, which exists only on Linux) shipped to
  # Windows users as entity models that never rendered. This job exists so the next OS assumption fails here instead:
  # :celtium-vulkan:test loads the host OS's real LWJGL/shaderc natives and runs the provider-selection code for the
  # host, and the check scripts below are pure file inspection. The full Forge build (:forge122:packageJar) stays on
  # the Ubuntu legs - the jar it ships is platform-independent, and the RetroFuturaGradle pipeline is not part of what
  # this job verifies.
  vulkan-multi-os:
    name: vulkan (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # The shader compiler is pinned to the same upstream release on both legs (Khronos glslang 16.6.0, the official
      # release archives) and put on PATH. The build is deliberately NOT handed -Pglslang_validator: its own candidate
      # resolution - the PATH lookup, including the Windows .exe probe - is what runs, so this job is also the
      # regression test for that lookup. The Windows archive ships only glslang.exe (upstream renamed the validator
      # binary in glslang 15), so it is staged under the historical name the build tries first; the build's final
      # candidate would find it under its new name as well.
      - name: Install the shader compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-windows-x86_64-release.zip' -OutFile glslang.zip
          Expand-Archive glslang.zip -DestinationPath glslang-dist
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\glslang-bin" | Out-Null
          Copy-Item glslang-dist\bin\glslang.exe "$env:RUNNER_TEMP\glslang-bin\glslangValidator.exe"
          echo "$env:RUNNER_TEMP\glslang-bin" >> $env:GITHUB_PATH
      - name: Install the shader compiler (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -sL -o glslang.zip 'https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-macos-universal-release.zip'
          unzip -q glslang.zip -d glslang-dist
          chmod +x glslang-dist/bin/*
          echo "$PWD/glslang-dist/bin" >> "$GITHUB_PATH"
      - name: Test celtium-vulkan
        shell: bash
        run: ./gradlew -p build-1122 :celtium-vulkan:test --console=plain --stacktrace
      - name: Run the OS-portable check scripts
        shell: bash
        run: |
          python3 scripts/check_agent_docs.py
          python3 scripts/instrument-index.py --check
