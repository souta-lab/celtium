name: Celtium

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4.4.4
      - name: Test and package isolated capability probe
        run: ./gradlew -p celtium-probe test distZip --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: celtium-probe
          path: celtium-probe/build/distributions/*.zip

  minecraft-1122:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21
      - uses: gradle/actions/setup-gradle@v4.4.4
      - name: Build Minecraft 1.12.2 mod
        run: ./gradlew -p build-1122 :forge122:packageJar --console=plain --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: celtium-forge-1122
          path: build-1122/build/libs/**/*.jar
