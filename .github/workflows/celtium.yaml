name: Celtium

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test development-process safety (no GPU or game)
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 scripts/cpu-contract/shared_game_slot_check.py
          python3 scripts/check_agent_docs.py
          bash -n scripts/gv-leg.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4.4.4
      - name: Test GPU-independent Vulkan and GL compatibility contracts
        run: |
          python3 scripts/cpu-contract/post_create_rollback_check.py
          python3 scripts/cpu-contract/framebuffer_release_check.py
          python3 scripts/cpu-contract/immediate_group_pool_check.py
          python3 scripts/cpu-contract/gl_rectangle_queries_check.py
          python3 scripts/cpu-contract/dynamic_texture_dimensions_check.py
          python3 scripts/cpu-contract/texture_registry_stub_queries_check.py
          python3 scripts/cpu-contract/texture_allocation_extent_check.py
          python3 scripts/cpu-contract/offtarget_rendered_name_check.py
          python3 scripts/cpu-contract/shader_push_constant_check.py
          python3 scripts/cpu-contract/present_drain_check.py
          python3 scripts/cpu-contract/font-state-boundary-check.py
          python3 scripts/cpu-contract/parallel_atlas_await_check.py
          python3 scripts/cpu-contract/parallel_atlas_sync_refusal_check.py
          python3 scripts/modpack-compat/test_lock_archive.py
          python3 scripts/modpack-compat/test_e2e_celtium_mods.py
          python3 scripts/modpack-compat/test_e2e_stellar_parallel_config.py
          python3 scripts/modpack-compat/test_cf_file_index.py
          python3 scripts/modpack-compat/test_pack_stage_resolve.py
          python3 scripts/cpu-contract/pack_stage_check.py
          python3 scripts/cpu-contract/contested_mixin_exclusion_check.py
          python3 scripts/cpu-contract/fixture_tick_liveness_check.py
          python3 scripts/cpu-contract/repeatable_screen_dismissal_check.py
          python3 scripts/cpu-contract/immediate_group_stack_scope_check.py
          python3 scripts/cpu-contract/live_terrain_backend_report_check.py
          python3 scripts/cpu-contract/glless_mapped_staging_guard_check.py
          python3 scripts/cpu-contract/isolated_game_directory_check.py
          python3 scripts/cpu-contract/glless_early_install_check.py
          python3 scripts/cpu-contract/glless_transformer_injection_check.py
          python3 scripts/cpu-contract/glless_lwjgl3_surface_check.py
          python3 scripts/cpu-contract/glless_matrix_queries_check.py
          python3 scripts/cpu-contract/glless_clear_producer_check.py
          python3 scripts/cpu-contract/glless_clear_consumer_check.py
          python3 scripts/cpu-contract/draw_state_provenance_check.py
      - name: Test and package isolated capability probe
        run: ./gradlew -p celtium-probe test distZip --console=plain
      - name: Test shaderpack frontend (pure CPU, fixture packs only)
        run: ./gradlew -p celtium-shaderpack test --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: celtium-probe
          path: celtium-probe/build/distributions/*.zip

  minecraft-1122:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21
            25
      - uses: gradle/actions/setup-gradle@v4.4.4
      # :celtium-vulkan:compileTerrainShaders compiles the shaders into the packaged resources, and its compiler path
      # defaults to the workspace-relative, gitignored `.celtium-work/gpu-tools/extracted/usr/bin/glslangValidator`
      # (`celtium-vulkan/build.gradle:124-133`, wired into `processResources`). A checkout has neither that directory
      # nor the tool, so every PR failed with `Cannot run program ".../.celtium-work/...": Exec failed, error: 2`.
      # The compiler is a build dependency, not an optional tool - the SPIR-V it emits is what the loader reads - so it
      # is installed here and handed to the task through the property the task already reads
      # (`providers.gradleProperty('glslang_validator')`). Compiling and validating the shaders stays in the build;
      # nothing is skipped and no check is removed.
      - name: Install the shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslang-tools
          glslangValidator --version | head -1
      - name: Build Minecraft 1.12.2 mod
        run: >-
          ./gradlew -p build-1122 :forge122:packageJar --console=plain --stacktrace
          "-Pglslang_validator=$(command -v glslangValidator)"
      # These contracts require full Git history and compiled celtium-vulkan classes.
      # Keep them after the real Forge build, not in the isolated probe job.
      - name: Test compiled swapchain arguments and initializer preservation
        run: |
          python3 scripts/cpu-contract/field_initializer_check.py
          python3 scripts/cpu-contract/swapchain_create_args_check.py
          python3 scripts/cpu-contract/frustum_camera_offset_check.py
      - name: Verify packaged mod contents
        run: python3 scripts/verify_forge_jar.py build-1122/build/libs/*/*.jar
      # The artifact's name, its mcmod.info version, the build's default and the plan's header table are four places the
      # same version is written; nothing compared them, and a leg was once run against a jar left over from the previous
      # naming family because a recipe still pointed at the old path (docs/plan.md row 47). This reads all four and
      # names the field that disagrees.
      - name: Verify artifact versions
        run: python3 scripts/verify_version_consistency.py
      - uses: actions/upload-artifact@v4
        with:
          name: celtium-forge-1122
          path: build-1122/build/libs/**/*.jar
