name: Celtium Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive release version from tag
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [ "$tag" = "$version" ] || ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)*$ ]]; then
            echo "Tag '$tag' must match v<major>.<minor>.<patch>[-prerelease]" >&2
            exit 1
          fi
          prerelease="false"
          if [[ "$version" == *-* ]]; then
            prerelease="true"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21
            25

      - uses: gradle/actions/setup-gradle@v4.4.4

      - name: Install the shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslang-tools
          glslangValidator --version | head -1

      - name: Test celtium-vulkan
        run: >-
          ./gradlew -p build-1122 :celtium-vulkan:test --console=plain --stacktrace
          "-Pceltium_release_version=${{ steps.meta.outputs.version }}"
          "-Pglslang_validator=$(command -v glslangValidator)"

      - name: Build release Minecraft 1.12.2 mod
        run: >-
          ./gradlew -p build-1122 :forge122:packageJar --console=plain --stacktrace
          "-Pceltium_release_version=${{ steps.meta.outputs.version }}"
          "-Pglslang_validator=$(command -v glslangValidator)"

      - name: Verify packaged mod contents and version consistency
        id: verify
        run: |
          set -o pipefail
          version="${{ steps.meta.outputs.version }}"
          jar="build-1122/build/libs/${version}/celtium-forge-mc1.12.2-${version}.jar"
          if [ ! -f "$jar" ]; then
            echo "Expected packaged jar not found: $jar" >&2
            exit 1
          fi
          python3 scripts/verify_forge_jar.py "$jar" --output release-verify-forge-jar.json
          python3 scripts/verify_version_consistency.py --jar "$jar" --json | tee release-verify-version.json
          echo "jar=$jar" >> "$GITHUB_OUTPUT"

      - name: Package release assets and SHA-256
        run: |
          jar="${{ steps.verify.outputs.jar }}"
          jar_name="$(basename "$jar")"
          mkdir -p release-assets
          cp -- "$jar" "release-assets/$jar_name"
          (
            cd release-assets
            sha256sum "$jar_name" > "${jar_name}.sha256"
            sha256sum -c "${jar_name}.sha256"
          )
          sha256="$(awk '{print $1}' "release-assets/${jar_name}.sha256")"
          {
            echo "## Celtium ${{ steps.meta.outputs.tag }}"
            echo ""
            echo "- Artifact: \`${jar_name}\`"
            echo "- SHA-256: \`${sha256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: celtium-release-${{ steps.meta.outputs.version }}
          path: |
            release-assets/*.jar
            release-assets/*.jar.sha256
            release-verify-forge-jar.json
            release-verify-version.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          version="${{ steps.meta.outputs.version }}"
          prerelease="${{ steps.meta.outputs.prerelease }}"
          jar_name="celtium-forge-mc1.12.2-${version}.jar"
          jar_path="release-assets/${jar_name}"
          sha_path="release-assets/${jar_name}.sha256"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$jar_path" "$sha_path" --clobber
          else
            args=(--title "Celtium ${version}")
            if [ "$prerelease" = "true" ]; then
              args+=(--prerelease)
            fi
            if [ -f "docs/releases/${version}-en.md" ]; then
              args+=(--notes-file "docs/releases/${version}-en.md")
            elif [ -f "docs/releases/${version}.md" ]; then
              args+=(--notes-file "docs/releases/${version}.md")
            else
              args+=(--generate-notes)
            fi
            gh release create "$tag" "$jar_path" "$sha_path" "${args[@]}"
          fi
