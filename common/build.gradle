plugins {
    id 'java-library'
    id 'maven-publish'
}

group = "org.embeddedt.celeritas"
// Pinned GTNH release; rootProject.version is upstream's tau-derived version.
version = "2.5.12-GTNH"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    // HarnessConfig (org.soutalab.celtium.harness) moved to :celtium-core in the v0.4.0 S1-a stage;
    // the chunk renderers here still read it. The harnessJar artifact carries the class at release 21,
    // which this module's 21 toolchain can read - :celtium-core's own sources are release 25 and are
    // not visible from here.
    implementation project(path: ':celtium-core', configuration: 'harnessJar')

    def lwjglVersion = "3.3.1"

    // LWJGL 3 is used directly (MemoryUtil, the GL classes, MemoryStack): the LWJGL service layer and its
    // generated GLxx wrappers are retired. At runtime Cleanroom supplies LWJGL 3, so this stays compileOnly
    // for main; tests exercise the memory seat for real and carry LWJGL plus its natives.
    compileOnly(platform("org.lwjgl:lwjgl-bom:$lwjglVersion"))
    compileOnly "org.lwjgl:lwjgl"
    compileOnly "org.lwjgl:lwjgl-opengl"

    testImplementation(platform("org.lwjgl:lwjgl-bom:$lwjglVersion"))
    testImplementation "org.lwjgl:lwjgl"
    testImplementation "org.lwjgl:lwjgl-opengl"
    testRuntimeOnly "org.lwjgl:lwjgl:$lwjglVersion:natives-linux"

    implementation "org.joml:joml:1.10.5"
    implementation "it.unimi.dsi:fastutil:7.1.0"
    implementation "org.apache.logging.log4j:log4j-api:2.0-beta9"
    compileOnly "org.jetbrains:annotations:24.1.0"
    compileOnly("org.projectlombok:lombok:1.18.30")
    annotationProcessor("org.projectlombok:lombok:1.18.30")
    implementation("org.ow2.asm:asm:9.6")
    implementation("org.ow2.asm:asm-tree:9.6")
    implementation("org.ow2.asm:asm-util:9.6")

    implementation "com.google.code.gson:gson:2.10.1"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()

    maxHeapSize = '1G'

    testLogging {
        events "passed"
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'celeritas-common'
            from components.java
        }
    }
    repositories {
        maven {
            name = "gtnh"
            url = uri("https://nexus.gtnewhorizons.com/repository/releases/")
            credentials {
                username = System.getenv("MAVEN_USER")
                password = System.getenv("MAVEN_PASSWORD")
            }
        }
    }
}

jar {
    def repositoryRoot = rootProject.findProperty('celtium_repository_root') ?: rootProject.projectDir
    from(new File(repositoryRoot, "COPYING"))
    from(new File(repositoryRoot, "COPYING.LESSER"))
    manifest {
        attributes([
                "Lwjgl3ify-Aware": "true"
        ])
    }
}

// The jar the mod embeds: every source set's classes at release 21. Celtium runs on Cleanroom only, whose JVM is 21+,
// so the classes ship as compiled; they used to be downgraded to Java 8 and carry JVM Downgrader's runtime stubs.
configurations {
    modJar {
        canBeConsumed = true
        canBeResolved = false
    }
}

artifacts {
    modJar(tasks.named("jar"))
}

// make RFG stop complaining
def obfAttr = Attribute.of("com.gtnewhorizons.retrofuturagradle.obfuscation", String)
def transformedAttr = Attribute.of("rfgDeobfuscatorTransformed", Boolean)

["runtimeElements", "modJar"].forEach { name ->
    configurations.getByName(name).attributes {
        attribute(obfAttr, "mcp")
        attribute(transformedAttr, true)
    }
}
