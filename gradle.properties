org.gradle.jvmargs=-Xmx2G
org.gradle.workers.max=2
org.gradle.configureondemand=true
org.gradle.configuration-cache=true
org.gradle.caching=true

mod_package=org.embeddedt.embeddium
mod_id=embeddium
mod_display_name=Celtium
mod_description=A native Vulkan renderer for Minecraft 1.12.2 on CleanroomMC
# Comma separated, i.e.: "Person A,Person B,Person C"
mod_authors=embeddedt
mod_contributors=jellysquid3
license=LGPL-3.0

homepage_url=https://github.com/souta-lab/celtium
sources_url=https://github.com/souta-lab/celtium
issue_tracker_url=https://github.com/souta-lab/celtium/issues

# Isolated probe distribution only; no replacement LWJGL runtime is bundled into the mod.
celtium_lwjgl_version=3.4.3
# The mod compiles against the LWJGL that Cleanroom 0.7 ships (SDL 3 windowing, 3.4.3).
celtium_mod_lwjgl_version=3.4.3

lombok_version=1.18.44

# If this is blank, the stock version is used. This also bundles mixinextras into the JAR file if it is not the same as the stock version.
mixinextras=0.4.1

authors=souta-lab
contributors=Celeritas (fixed reference 989ebf2e), Embeddium, Sodium and the Iris project: Celtium terrain, chunk and shader plumbing derive from their LGPL-3.0 work
