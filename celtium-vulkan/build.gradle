plugins {
    id 'java-library'
}

group = 'org.soutalab.celtium'
version = '0.1.0-dev.1'

repositories { mavenCentral() }

tasks.withType(JavaCompile).configureEach {
    // Minimum runtime is Java 21 (user decision, 2026-10-09 14:11). Verified builds run on JDK 25, but nothing here may use
    // a Java 22+ API, language feature or preview: the distinction between "built on 25" and "runs on 21" is kept explicit.
    options.release = 21
    options.encoding = 'UTF-8'
}

// The mod-side Vulkan code is compiled against the LWJGL version the validated Cleanroom installation ships.
// It is never bundled: the installation provides the bindings, and when they are missing every entry point
// reports a diagnostic instead of failing.
def lwjglVersion = providers.gradleProperty('celtium_mod_lwjgl_version').getOrElse('3.4.1')

// The Vulkan terrain backend implements the mod's own interfaces, so it compiles against the shared core.
// The core classes are provided by the mod at runtime; nothing is bundled here.
def coreProject = findProject(':common')
if (coreProject != null) {
    dependencies {
        compileOnly(project(path: ':common', configuration: 'downgraded')) { transitive = false }
    }
}

dependencies {
    compileOnly platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    compileOnly 'org.lwjgl:lwjgl'
    compileOnly 'org.lwjgl:lwjgl-opengl'
    compileOnly 'org.lwjgl:lwjgl-vulkan'
    // The swapchain needs the window's native handles, which GLFW exposes; like the other LWJGL modules this is
    // never bundled and the module reports a diagnostic when it is missing.
    compileOnly 'org.lwjgl:lwjgl-glfw'
    compileOnly 'com.google.code.gson:gson:2.10.1'
    // The mod's core API exposes joml matrices. They are relocated into the mod's own namespace by the shadow
    // step, and this module goes through that same step, so it compiles against the original coordinates.
    compileOnly 'org.joml:joml:1.10.5'
    // The mod's render API is expressed with fastutil collections, which Minecraft already provides.
    compileOnly 'it.unimi.dsi:fastutil:7.1.0'

    testImplementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    testImplementation 'org.lwjgl:lwjgl'
    testImplementation 'org.lwjgl:lwjgl-opengl'
    testImplementation 'org.lwjgl:lwjgl-vulkan'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Mirror celtium-probe: the mod consumes exactly this jar, with no runtime dependencies and no
// classes/resources directory variants for Gradle to confuse on RFG's shadow classpath.
configurations {
    modEmbed {
        canBeConsumed = true
        canBeResolved = false
        attributes {
            attribute(Attribute.of('com.gtnewhorizons.retrofuturagradle.obfuscation', String), 'mcp')
            attribute(Attribute.of('rfgDeobfuscatorTransformed', Boolean), true)
        }
    }
}
artifacts {
    modEmbed(tasks.named('jar'))
}
tasks.named('test') { useJUnitPlatform() }

// ------------------------------------------------------------------------------------------------
// Terrain shaders: GLSL -> SPIR-V, as part of the build.
//
// These shaders used to ship as committed .spv files that nothing regenerated, so editing the GLSL
// changed nothing in the running game and two rounds of "measured, no change" were measuring the
// previous build. Compiling them here - into the resources the loader already reads - makes that
// impossible: the sources are declared inputs, and a stale artefact cannot survive a build.
// ------------------------------------------------------------------------------------------------
def terrainSpirvOutput = layout.buildDirectory.dir('generated/terrain-spirv')
def compileTerrainShaders = tasks.register('compileTerrainShaders') {
    inputs.files(fileTree('src/main/shaders'))
    // Resolved against the workspace root, because the build runs from the composite directory (build-1122) and a
    // relative command line is not found by the exec'ing task.
    def workspaceRoot = rootProject.projectDir.parentFile
    def compilerSetting = providers.gradleProperty('glslang_validator')
            .getOrElse('.celtium-work/gpu-tools/extracted/usr/bin/glslangValidator')
    def compiler = new File(compilerSetting).absolute ? compilerSetting
            : new File(workspaceRoot, compilerSetting).absolutePath
    inputs.property('compiler', compiler)
    outputs.dir(terrainSpirvOutput)
    doLast {
        def directory = new File(terrainSpirvOutput.get().asFile, 'org/soutalab/celtium/vulkan/spirv')
        directory.mkdirs()
        fileTree('src/main/shaders').files.sort().each { shader ->
            providers.exec {
                commandLine compiler, '-V', '--target-env', 'vulkan1.0', shader.absolutePath,
                        '-o', new File(directory, shader.name + '.spv').absolutePath
            }.result.get().assertNormalExitValue()
        }
    }
}
sourceSets.main.resources.srcDir(terrainSpirvOutput)
tasks.named('processResources') { dependsOn compileTerrainShaders }
