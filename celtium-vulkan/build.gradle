plugins {
    id 'java-library'
}

group = 'org.soutalab.celtium'
version = '0.1.0-dev.1'

repositories { mavenCentral() }

tasks.withType(JavaCompile).configureEach {
    // Minimum runtime is Java 21 (user decision, 2026-10-09 14:11). Verified builds run on JDK 25, but nothing here may use
    // a Java 22+ API, language feature or preview: the distinction between "built on 25" and "runs on 21" is kept explicit.
    options.release = 21
    options.encoding = 'UTF-8'
}

// The mod-side Vulkan code is compiled against the LWJGL version the validated Cleanroom installation ships.
// It is never bundled: the installation provides the bindings, and when they are missing every entry point
// reports a diagnostic instead of failing.
def lwjglVersion = providers.gradleProperty('celtium_mod_lwjgl_version').getOrElse('3.4.1')

// The Vulkan terrain backend implements the mod's own interfaces, so it compiles against the shared core.
// The core classes are provided by the mod at runtime; nothing is bundled here.
def coreProject = findProject(':common')
if (coreProject != null) {
    dependencies {
        compileOnly(project(path: ':common', configuration: 'downgraded')) { transitive = false }
    }
}

dependencies {
    compileOnly platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    compileOnly 'org.lwjgl:lwjgl'
    compileOnly 'org.lwjgl:lwjgl-opengl'
    compileOnly 'org.lwjgl:lwjgl-vulkan'
    // The swapchain needs the window's native handles, which GLFW exposes; like the other LWJGL modules this is
    // never bundled and the module reports a diagnostic when it is missing.
    compileOnly 'org.lwjgl:lwjgl-glfw'
    compileOnly 'com.google.code.gson:gson:2.10.1'
    // The mod's core API exposes joml matrices. They are relocated into the mod's own namespace by the shadow
    // step, and this module goes through that same step, so it compiles against the original coordinates.
    compileOnly 'org.joml:joml:1.10.5'
    // The mod's render API is expressed with fastutil collections, which Minecraft already provides.
    compileOnly 'it.unimi.dsi:fastutil:7.1.0'

    testImplementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    testImplementation 'org.lwjgl:lwjgl'
    testImplementation 'org.lwjgl:lwjgl-opengl'
    testImplementation 'org.lwjgl:lwjgl-vulkan'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Mirror celtium-probe: the mod consumes exactly this jar, with no runtime dependencies and no
// classes/resources directory variants for Gradle to confuse on RFG's shadow classpath.
configurations {
    modEmbed {
        canBeConsumed = true
        canBeResolved = false
        attributes {
            attribute(Attribute.of('com.gtnewhorizons.retrofuturagradle.obfuscation', String), 'mcp')
            attribute(Attribute.of('rfgDeobfuscatorTransformed', Boolean), true)
        }
    }
}
artifacts {
    modEmbed(tasks.named('jar'))
}
tasks.named('test') { useJUnitPlatform() }

// ------------------------------------------------------------------------------------------------
// Terrain shaders: GLSL -> SPIR-V, as part of the build.
//
// These shaders used to ship as committed .spv files that nothing regenerated, so editing the GLSL
// changed nothing in the running game and two rounds of "measured, no change" were measuring the
// previous build. Compiling them here - into the resources the loader already reads - makes that
// impossible: the sources are declared inputs, and a stale artefact cannot survive a build.
// ------------------------------------------------------------------------------------------------
def terrainSpirvOutput = layout.buildDirectory.dir('generated/terrain-spirv')

/**
 * Compiles the terrain and immediate shaders into the resources the loader reads.
 * <p>
 * Written as a task class with an injected {@link ExecOperations}, because the provider-based exec API forbids configuring
 * the process's standard streams ("Standard streams cannot be configured for exec output provider") and the compiler's own
 * message is exactly what a failed shader needs to report - the layout migration that was reverted had to be diagnosed by
 * running glslangValidator over every file by hand.
 */
abstract class CeltiumCompileShaders extends DefaultTask {
    @Inject
    abstract ExecOperations getExecOperations()

    @InputFiles
    abstract ConfigurableFileCollection getShaderSources()

    /** The explicit {@code -Pglslang_validator=...}, or empty when the candidates below decide. */
    @Input
    abstract Property<String> getCompilerPath()

    /**
     * Where the compiler may be, in the order it is tried: the explicit property, the developer machine's copy under
     * {@code .celtium-work} (the extracted Debian package - gitignored, so a fresh checkout does not have it), and the
     * bare name {@code glslangValidator}, which {@link #findOnPath} resolves. Listing them as inputs is what makes a
     * change of compiler re-run the task.
     */
    @Input
    abstract ListProperty<String> getCompilerCandidates()

    @OutputDirectory
    abstract DirectoryProperty getSpirvDirectory()

    /**
     * {@return the first candidate that can be started}.
     * <p>
     * The default used to be the workspace copy alone, so a checkout without the gitignored {@code .celtium-work}
     * directory - CI, a fresh clone, another machine - could not start the program at all and failed with a bare
     * {@code Exec failed, error: 2} that named neither the tool nor what to install. A missing compiler is a build
     * input problem, so it is reported as one.
     */
    private String resolveCompiler() {
        def candidates = getCompilerCandidates().get().findAll { it != null && !it.isEmpty() }
        for (candidate in candidates) {
            def file = new File(candidate)
            if (file.isAbsolute()) {
                if (file.canExecute()) {
                    return candidate
                }
                continue
            }
            def onPath = findOnPath(candidate)
            if (onPath != null) {
                return onPath
            }
        }
        throw new GradleException(compilerNotFound(candidates))
    }

    /**
     * {@return the first executable {@code name} on {@code PATH}, then in the package's own directories}.
     * <p>
     * Resolved here rather than left to the OS because the Gradle daemon outlives the shell that installed the
     * package: its PATH can be the one from before the install. {@code /usr/bin} is where the Debian/Ubuntu package
     * puts it, so a daemon started earlier still finds it.
     */
    private static String findOnPath(String name) {
        def path = System.getenv('PATH')
        def directories = []
        if (path != null) {
            directories.addAll(path.split(File.pathSeparator).findAll { !it.isEmpty() })
        }
        directories.addAll(['/usr/bin', '/usr/local/bin', '/bin'])
        for (directory in directories) {
            def candidate = new File(directory, name)
            if (candidate.canExecute()) {
                return candidate.absolutePath
            }
        }
        return null
    }

    /** The message a build without the work directory and without the package needs, naming both ways out. */
    private static String compilerNotFound(List<String> candidates) {
        return "glslangValidator was not found. Looked at: ${candidates.join(', ')}.\n" +
                "The shaders are compiled into the packaged resources, so this task cannot be skipped - install the " +
                "compiler (Debian/Ubuntu: 'apt-get install glslang-tools') or point the build at one with " +
                "-Pglslang_validator=/absolute/path/to/glslangValidator."
    }

    @TaskAction
    void compileShaders() {
        def compiler = resolveCompiler()
        logger.lifecycle("compileTerrainShaders: compiling ${getShaderSources().files.size()} shaders with ${compiler}")
        def directory = new File(getSpirvDirectory().get().asFile, 'org/soutalab/celtium/vulkan/spirv')
        directory.mkdirs()
        getShaderSources().files.sort { it.name }.each { shader ->
            def output = new ByteArrayOutputStream()
            def result
            try {
                result = getExecOperations().exec {
                    commandLine compiler, '-V', '--target-env', 'vulkan1.0', shader.absolutePath,
                            '-o', new File(directory, shader.name + '.spv').absolutePath
                    standardOutput = output
                    errorOutput = output
                    ignoreExitValue = true
                }
            } catch (java.io.IOException failure) {
                // A candidate that disappeared between the check and the launch lands here; keep the actionable message
                // rather than the raw IOException.
                throw new GradleException(compilerNotFound(getCompilerCandidates().get()) + "\nUnderlying: ${failure.message}",
                        failure)
            }
            if (result.exitValue != 0) {
                logger.error("glslangValidator failed on ${shader.name} (exit ${result.exitValue}):\n${output.toString('UTF-8')}")
                throw new GradleException("shader compilation failed: ${shader.name} - the compiler output is above")
            }
        }
    }
}

def compileTerrainShaders = tasks.register('compileTerrainShaders', CeltiumCompileShaders) {
    def workspaceRoot = rootProject.projectDir.parentFile
    def compilerSetting = providers.gradleProperty('glslang_validator').orNull
    shaderSources.from(fileTree('src/main/shaders'))
    compilerPath.set(compilerSetting == null ? ''
            : (new File(compilerSetting).absolute ? compilerSetting : new File(workspaceRoot, compilerSetting).absolutePath))
    // The workspace copy first so this machine keeps using the pinned package, then PATH so a checkout that has no
    // .celtium-work (CI, a fresh clone, another machine) can compile and validate the same shaders instead of failing
    // to start a program that was never there. The property, when given, wins over both.
    compilerCandidates.set([
            compilerPath.get(),
            new File(workspaceRoot, '.celtium-work/gpu-tools/extracted/usr/bin/glslangValidator').absolutePath,
            'glslangValidator',
    ])
    spirvDirectory.set(terrainSpirvOutput)
}
sourceSets.main.resources.srcDir(terrainSpirvOutput)
tasks.named('processResources') { dependsOn compileTerrainShaders }
